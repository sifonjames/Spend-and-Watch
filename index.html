<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spend Watch</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#14241c;--mute:#5d6f65;--line:#dbe4df;--ok:#1f8a5b;--warn:#d98a00;--bad:#d62839;--badbg:#fde8ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#18231d;--ink:#e8f0eb;--mute:#93a79b;--line:#2a3a32;--ok:#3ecf8e;--warn:#f0b429;--bad:#ff5c6c;--badbg:#3a181d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#18231d;--ink:#e8f0eb;--mute:#93a79b;--line:#2a3a32;--ok:#3ecf8e;--warn:#f0b429;--bad:#ff5c6c;--badbg:#3a181d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.total{font-size:1.7rem;font-weight:700;line-height:2.6rem;transition:color .3s}
.bigin{font-size:1.4rem;font-weight:700}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.fill{height:100%;width:0;background:var(--ok);transition:width .4s,background .3s}
.state{font-weight:600}
.alert{display:none;background:var(--badbg);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:600}
.alert.on{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,select,button{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--ink);color:var(--bg);border:0;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:1px}
.add{margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;border-left:6px solid var(--ok)}
.item .n{flex:1;min-width:0}
.item .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n span{font-size:.8rem;color:var(--mute)}
.item.big{background:var(--badbg);border-color:var(--bad);border-left-color:var(--bad)}
.item.big .amt{color:var(--bad)}
.amt{font-weight:700}
.del{width:auto;padding:6px 10px;background:transparent;color:var(--mute);border:1px solid var(--line)}
.plan{border-radius:10px;padding:12px;margin-top:10px;font-weight:600;border:2px solid var(--line);min-height:48px}
.plan.ok{border-color:var(--ok);color:var(--ok)}.plan.warn{border-color:var(--warn);color:var(--warn)}.plan.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.empty{color:var(--mute);text-align:center;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center}
.chartwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none}.hole{width:92px;height:92px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:.8rem;text-align:center;padding:4px}.legend{flex:1;min-width:170px}.lg{display:flex;align-items:center;gap:8px;padding:4px 0}.lg i{width:12px;height:12px;border-radius:50%;flex:none}.lg span{flex:1}.lg em{font-style:normal;color:var(--mute);width:42px;text-align:right}
.link{width:auto;background:transparent;color:var(--mute);border:0;padding:4px;font-weight:400;text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>Spend Watch</h1>
  <p class="sub">Log what you spend. Go over your daily limit and it turns red.</p>

  <section class="card" aria-live="polite">
    <div class="top"><span class="sub" style="margin:0">This month</span>
      <select id="cur" aria-label="Currency" style="width:auto"><option>₦</option><option>$</option><option>£</option><option>€</option></select></div>
    <div class="row2" style="margin-top:10px">
      <div><label for="budget">Monthly budget</label><input id="budget" class="bigin" type="number" inputmode="decimal" min="0" value="100000"></div>
      <div><label>Spent so far</label><div class="total" id="total">₦0</div></div>
    </div>
    <div class="state" id="left" style="margin-top:6px"></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="state" id="state"></div>
    <div class="state" id="today" style="margin-top:6px"></div>
    <div class="alert" id="alert"></div>
  </section>

  <section class="card">
    <label for="plan"><b>Before you buy: how much is it?</b></label>
    <input id="plan" type="number" inputmode="decimal" min="0" placeholder="Enter the price">
    <div class="plan" id="planRes" aria-live="polite">Type a price to see if you can afford it.</div>
  </section>

  <section class="card">
    <div class="row2">
      <div><label for="daily">Daily limit</label><input id="daily" type="number" inputmode="decimal" min="0" value="0"></div>
    </div>
  </section>

  <section class="card">
    <div class="row2">
      <div><label for="name">What did you buy?</label><input id="name" placeholder="e.g. Lunch"></div>
      <div><label for="amount">Amount</label><input id="amount" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    </div>
    <div class="row2" style="margin-top:10px">
      <div><label for="cat">Category</label>
        <select id="cat"><option>Food</option><option>Transport</option><option>Bills</option><option>Shopping</option><option>Health</option><option>Other</option></select></div>
      <div><label for="date">Date</label><input id="date" type="date"></div>
    </div>
    <button class="add" id="addBtn">Add expense</button>
  </section>

  <section class="card">
    <b>Where your money goes</b>
    <div id="chart"></div>
  </section>

  <section class="card">
    <b>Daily record</b>
    <div id="days" style="margin-top:10px"></div>
  </section>

  <section>
    <div class="top" style="margin-bottom:8px"><b>Expenses</b><select id="view" aria-label="Choose month" style="width:auto"></select><button class="link" id="clear">Clear all</button></div>
    <div id="list"></div>
  </section>
</main>
<script>
(function(){
  var KEY="spendwatch:v1", S={items:[],budget:100000,big:20000,daily:0,cur:"₦"};
  try{var raw=localStorage.getItem(KEY); if(raw){var p=JSON.parse(raw); if(p&&p.items) S=Object.assign(S,p);}}catch(e){}
  var $=function(id){return document.getElementById(id)};
  $("date").value=today();
  $("daily").value=S.daily; $("budget").value=S.budget; $("cur").value=S.cur;
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  function fmt(n){return S.cur+Number(n).toLocaleString(undefined,{maximumFractionDigits:2})}
  function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function render(){
    S.budget=+$("budget").value||0; S.daily=+$("daily").value||0; S.cur=$("cur").value;
    var mk=today().slice(0,7);
    var total=S.items.filter(function(i){return i.date.slice(0,7)===mk}).reduce(function(a,i){return a+i.amount},0);
    var pct=S.budget>0?total/S.budget*100:0;
    var col=pct>=100?"var(--bad)":pct>=80?"var(--warn)":"var(--ok)";
    $("total").textContent=fmt(total); $("total").style.color=col;
    $("left").textContent=S.budget>0?(S.budget>=total?fmt(S.budget-total)+" left to spend":"Over budget by "+fmt(total-S.budget)):"Enter your monthly budget above";
    $("left").style.color=col;
    $("fill").style.width=Math.min(pct,100)+"%"; $("fill").style.background=col;
    $("state").textContent=S.budget>0?Math.round(pct)+"% of "+fmt(S.budget)+" budget":"Set a budget above";
    $("state").style.color=col;
    var td=todaySum(), dOver=S.daily>0&&td>S.daily;
    $("today").textContent=S.daily>0?"Today: "+fmt(td)+" of "+fmt(S.daily)+(dOver?". You’ve overspent today, cut back.":""):"Set a daily limit below to track each day.";
    $("today").style.color=dOver?"var(--bad)":"var(--ok)";
    var msgs=[];
    if(dOver) msgs.push("You’re over today’s limit by "+fmt(td-S.daily)+".");
    if(pct>=100) msgs.push("Over budget by "+fmt(total-S.budget)+".");
    else if(pct>=80) msgs.push("Careful: you’ve used "+Math.round(pct)+"% of your budget.");
    var bigs=0;
    if(bigs) msgs.push(bigs+" big purchase"+(bigs>1?"s":"")+" at or above "+fmt(S.big)+".");
    $("alert").textContent=msgs.join(" "); $("alert").classList.toggle("on",pct>=80||bigs>0||dOver);
    var months=[mk]; S.items.forEach(function(i){var m=i.date.slice(0,7); if(months.indexOf(m)<0) months.push(m)}); months.sort().reverse();
    var vs=$("view"), keep=vs.value||mk;
    vs.innerHTML='<option value="all">All records</option>'+months.map(function(m){return '<option value="'+m+'">'+monthName(m)+'</option>'}).join("");
    vs.value=(keep==="all"||months.indexOf(keep)>-1)?keep:mk;
    var shown=S.items.filter(function(i){return vs.value==="all"||i.date.slice(0,7)===vs.value});
    drawChart(shown); drawDays(shown);
    var dayTot={}; S.items.forEach(function(i){dayTot[i.date]=(dayTot[i.date]||0)+i.amount});
    var sorted=shown.slice().sort(function(a,b){return b.date.localeCompare(a.date)||b.id-a.id});
    $("list").innerHTML=sorted.length?sorted.map(function(i){
      var big=S.daily>0&&(dayTot[i.date]||0)>S.daily;
      return '<div class="item'+(big?' big':'')+'"><div class="n"><b>'+esc(i.name)+'</b><span>'+esc(i.cat)+' · '+i.date+(big?' · over daily limit':'')+'</span></div><div class="amt">'+fmt(i.amount)+'</div><button class="del" data-id="'+i.id+'" aria-label="Delete '+esc(i.name)+'">✕</button></div>';
    }).join(""):'<div class="empty">No expenses yet. Add your first one above.</div>';
    check();
    save();
  }
  function monthName(m){return new Date(m+"-01T00:00:00").toLocaleString(undefined,{month:"long",year:"numeric"})}
  function drawChart(items){
    var cats=["Food","Transport","Bills","Shopping","Health","Other"], cols=["#e8793a","#3b82f6","#8b5cf6","#ec4899","#14b8a6","#94a3b8"];
    var sums=cats.map(function(c){return items.filter(function(i){return i.cat===c}).reduce(function(a,i){return a+i.amount},0)});
    var tot=sums.reduce(function(a,b){return a+b},0), el=$("chart");
    if(!tot){el.innerHTML='<div class="empty">Add expenses to see your spending chart.</div>';return}
    var acc=0, stops=sums.map(function(s,k){var a=acc/tot*100; acc+=s; return cols[k]+" "+a+"% "+(acc/tot*100)+"%"}).join(",");
    var top=sums.indexOf(Math.max.apply(null,sums));
    el.innerHTML='<p class="sub" style="margin:8px 0 12px">Most of your money goes on <b>'+cats[top]+'</b> ('+Math.round(sums[top]/tot*100)+'%).</p><div class="chartwrap"><div class="donut" style="background:conic-gradient('+stops+')"><div class="hole">'+fmt(tot)+'</div></div><div class="legend">'+cats.map(function(c,k){return sums[k]?'<div class="lg"><i style="background:'+cols[k]+'"></i><span>'+c+'</span><b>'+fmt(sums[k])+'</b><em>'+Math.round(sums[k]/tot*100)+'%</em></div>':""}).join("")+'</div></div>';
  }
  $("view").addEventListener("change",render);
  function beep(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var ctx=new C(),t=ctx.currentTime;[0,0.3,0.6].forEach(function(d){var o=ctx.createOscillator(),g=ctx.createGain();o.type="square";o.frequency.value=880;g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.25,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.22);o.connect(g);g.connect(ctx.destination);o.start(t+d);o.stop(t+d+0.25)});if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function speak(msg){try{if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(msg);u.rate=0.95;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}}
  function drawDays(items){var m={};items.forEach(function(i){m[i.date]=(m[i.date]||0)+i.amount});var ds=Object.keys(m).sort().reverse();
    $("days").innerHTML=ds.length?ds.map(function(d){var o=S.daily>0&&m[d]>S.daily;return '<div class="item'+(o?' big':'')+'"><div class="n"><b>'+d+(d===today()?' (today)':'')+'</b><span>'+(S.daily>0?(o?'Over limit by '+fmt(m[d]-S.daily):'Within limit'):'No daily limit set')+'</span></div><div class="amt">'+fmt(m[d])+'</div></div>'}).join(""):'<div class="empty">Daily totals will show here.</div>'}
  var lastDay=today();
  function tick(){var t=today();if(t!==lastDay){lastDay=t;$("date").value=t;render()}}
  setInterval(tick,30000);document.addEventListener("visibilitychange",tick);
  function todaySum(){var k=today();return S.items.filter(function(i){return i.date===k}).reduce(function(a,i){return a+i.amount},0)}
  function check(){
    var p=+$("plan").value, box=$("planRes");
    if(!(p>0)){box.className="plan";box.textContent="Type a price to see if you can afford it.";return}
    var mk=today().slice(0,7), total=S.items.filter(function(i){return i.date.slice(0,7)===mk}).reduce(function(a,i){return a+i.amount},0), left=S.budget-total;
    var d=new Date(), daysLeft=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1;
    var perDay=left>0?left/daysLeft:0;
    if(p>left){box.className="plan bad";box.textContent="Don’t buy yet. This puts you "+fmt(p-Math.max(left,0))+" over your monthly budget."}
    else if(S.daily>0&&todaySum()+p>S.daily){box.className="plan bad";box.textContent="This puts you over today’s "+fmt(S.daily)+" limit. Wait until tomorrow if you can."}
    else if(p>left/2){box.className="plan warn";box.textContent="Think twice. It uses more than half of the "+fmt(left)+" you have left."}
    else{box.className="plan ok";box.textContent="You can afford it. You’d have "+fmt(left-p)+" left (about "+fmt((left-p)/daysLeft)+" a day)."}
  }
  $("plan").addEventListener("input",check);
  $("addBtn").onclick=function(){
    var amt=+$("amount").value, nm=$("name").value.trim();
    if(!nm||!(amt>0)){$("name").focus();return}
    S.items.push({id:Date.now(),name:nm,amount:amt,cat:$("cat").value,date:$("date").value||today()});
    $("name").value="";$("amount").value="";$("name").focus();render();
    var ad=S.items[S.items.length-1].date, at=S.items.filter(function(i){return i.date===ad}).reduce(function(a,i){return a+i.amount},0);
    if(S.daily>0&&at>S.daily){beep();setTimeout(function(){speak("Warning! You have exceeded your daily spend. Expenses breached for the day.")},900)}
  };
  $("list").onclick=function(e){var id=e.target.getAttribute&&e.target.getAttribute("data-id"); if(id){S.items=S.items.filter(function(i){return String(i.id)!==id});render()}};
  $("clear").onclick=function(){if(S.items.length&&confirm("Delete ALL saved records? This can’t be undone.")){S.items=[];render()}};
  ["budget","daily","cur"].forEach(function(id){$(id).addEventListener("input",render)});
  document.addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.target.id==="name"||e.target.id==="amount"))$("addBtn").click()});
  render();
})();
</script>
</body>
</html>
